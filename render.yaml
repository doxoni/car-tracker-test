# -*- coding: utf-8 -*-
# render.yaml — конфигурация деплоя на Render.com
# Подключение Mini App: BotFather -> Bot Settings -> Menu Button -> Web App URL

services:
  - type: web
    name: car-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app/main.py
    envVars:
      # Строка подключения к Google Cloud SQL (PostgreSQL).
      # Задаётся в Render Dashboard: postgresql://USER:PASSWORD@PUBLIC_IP:5432/cars?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Cloud SQL требует SSL для публичного IP
      - key: PGSSLMODE
        value: require
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: WHITELISTED_TELEGRAM_IDS
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: car-tracker
          property: host
    healthCheckPath: /api/health
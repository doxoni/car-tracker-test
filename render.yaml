# -*- coding: utf-8 -*-
# render.yaml — конфигурация деплоя на Render.com
# Подключение Mini App: BotFather -> Bot Settings -> Menu Button -> Web App URL
#
# База данных: PostgreSQL в облаке (Google Cloud SQL или Neon - зависит от
# того, что настроено скриптом setup_db.ps1). Render подключается к ней
# напрямую - отдельного механизма синхронизации не нужно, база одна и та же.

services:
  - type: web
    name: car-tracker-test
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Один воркер: бот работает long polling, несколько воркеров дали бы
    # конфликт опроса Telegram. Потоки внутри воркера - многопоточность.
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      # Строка подключения к PostgreSQL.
      # Ставится автоматически скриптом deploy_render.py.
      - key: DATABASE_URL
        sync: false
      # Облачные БД требуют SSL
      - key: PGSSLMODE
        value: require
      # Пул соединений под лимиты бесплатных хостингов
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "3"
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: WHITELISTED_TELEGRAM_IDS
        sync: false
      # Бот поднимается в потоке внутри веб-сервиса
      - key: BOT_ENABLED
        value: "1"
      - key: APP_URL
        fromService:
          type: web
          name: car-tracker-test
          property: host
    healthCheckPath: /api/health

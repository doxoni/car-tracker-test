# -*- coding: utf-8 -*-
# Настройки Alembic для car-tracker.
#
# Строка подключения берётся из переменной окружения DATABASE_URL
# (см. migrations/env.py). Значение sqlalchemy.url ниже - запасное,
# для локальной SQLite-базы.

[alembic]
script_location = migrations
prepend_sys_path = .

# file_template = %%(rev)s_%%(slug)s
# version_locations = %(here)s/bar:%(here)s/bar/multi:%(here)s/versions
# version_path_separator = os
# source_encoding = utf-8

sqlalchemy.url = sqlite:///cars.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

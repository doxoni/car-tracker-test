# -*- coding: utf-8 -*-
# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# version location; this is the location alembic will look for versions
# version_locations = %(here)s/bar:%(here)s/bar/multi:%(here)s/versions

# version path separator; As mentioned above, this is the character used
# to split version_locations. The default within new alembic.ini files is
# "os", which uses os.pathsep. If this key is omitted entirely, it falls
# back to the legacy behavior of splitting on spaces and/or newlines.
# version_path_separator = space

# The character set used to encode source files.
# source_encoding = utf-8

sqlalchemy.url = sqlite:///cars.db

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
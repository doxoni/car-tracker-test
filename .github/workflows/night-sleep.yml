# Ночная пауза сервиса: с 02:00 до 05:00 по Киеву сервис на Render
# полностью усыпляется (suspend через API Render), в 05:00 разбужается
# (resume).
#
# Почему именно suspend/resume, а не "просто перестать пинговать":
# у сервиса включён healthCheckPath /api/health, и сам Render стучится
# в него постоянно. Поэтому бесплатный сервис не засыпает от простоя.
# Усыпить сервис можно только явной командой API.
#
# Проверено на живом сервисе: после suspend любой запрос к домену
# отдаёт 503 и сервис сам не поднимается; после resume отвечает за
# примерно 30 секунд (холодный старт).
#
# Расписание Actions считается по UTC, а Киев зимой на 2 часа впереди
# UTC, летом - на 3. Поэтому точное решение принимается по киевскому
# времени (TZ=Europe/Kyiv), а сам cron стоит часто: так смена летнего
# времени ничего не ломает.
#
# Почему запуск идёт часто, а не точно в 02:00 и 05:00: запланированные
# запуски Actions иногда опаздывают на несколько часов. Команда auto
# смотрит на реальное состояние сервиса, поэтому любой запуск в любое
# время оставляет сервис в правильном состоянии:
#   - ночь: сервис должен спать - усыпляем его и ждём утра в том же
#     запуске, чтобы поднять его в 05:00 независимо от задержек;
#   - день: если сервис остался усыпленным - разбуживаем его.
#
# Секрет RENDER_API_KEY лежит в настройках репозитория (Actions secrets).
name: night-sleep

on:
  schedule:
    # Раз в 15 минут: успеваем и усыпить сервис, и разбудить его утром.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  night:
    runs-on: ubuntu-latest
    # Ночью скрипт ждёт утра и будит сервис - на это нужно до 3 часов.
    # Днём job отрабатывает за минуту, лимит ему не мешает.
    timeout-minutes: 240
    steps:
      - name: Забрать скрипт
        uses: actions/checkout@v4

      - name: Проверить киевское время
        id: clock
        run: |
          echo "time=$(TZ=Europe/Kyiv date +%H%M)" >> "$GITHUB_OUTPUT"
          echo "Киев: $(TZ=Europe/Kyiv date '+%Y-%m-%d %H:%M:%S')"

      - name: Показать состояние сервиса
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python3 night_sleep.py status

      # Усыпляем сервис ночью и разбужаем днём - одной командой:
      # скрипт сам смотрит на киевское время и на состояние сервиса.
      - name: Усыпить или разбудить сервис
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python3 night_sleep.py auto

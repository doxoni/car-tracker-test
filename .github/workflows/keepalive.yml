# Keep-alive сервиса car-tracker-test.
#
# Раньше этот workflow пинговал сервис днём по расписанию GitHub Actions.
# Теперь дневной пинг делает монитор UptimeRobot (см. workflow
# uptime-monitor и app/uptime.py), а GitHub нужен только как страховка:
# он включает и выключает сам монитор (по фактическому киевскому времени),
# а сам сервис больше не пингует.
#
# Осталось ручное запускание: если нужно разбудить сервис прямо сейчас -
# запусти этот workflow вручную (Actions -> keep-alive -> Run workflow).
# Скрипт keepalive.py пингует сервис только в дневное окно 07:00-23:00
# по Киеву, ночью пинга не будет.
name: keep-alive

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Забрать скрипт
        uses: actions/checkout@v4

      - name: Пинговать сервис в дневное окно
        run: |
          python3 keepalive.py

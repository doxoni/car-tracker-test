# Keep-alive сервиса car-tracker-test.
#
# Бесплатный Render усыпляет веб-сервис после 15 минут без входящих
# запросов. Пока контейнер работает - идут инстанс-часы: лимит 750
# часов в месяц. 31 день x 24 часа = 744, поэтому сервис, который
# работает круглые сутки, в конце 31-дневного месяца исчерпывает лимит
# и Render усыпляет бесплатные сервисы до следующего месяца.
#
# Поэтому:
#   - ночью пинга нет - контейнер засыпает сам и не тратит часы;
#   - днём пинг держит контейнер awake, чтобы Mini App открывался
#     сразу, без ожидания "SERVICE WAKING UP" (30-60 секунд).
#
# Почему окно, а не "пингуем всегда": без ночного окна выходит как раз
# 744+ часа - конец месяца. Окно 07:00-23:00 по Киеву - это 16 часов
# в сутки, около 500 часов в месяц, запас остаётся.
#
# Спящий сервис поднимает любой входящий запрос: сообщение в боте
# (Telegram шлёт вебхук) или открытие Mini App.
#
# Точное время по киевскому поясу (Europe/Kyiv) - смена летнего времени
# ничего не ломает. Cron в Actions опаздывает на часы, поэтому
# решение принимается по фактическому времени, а не по расписанию.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Забрать скрипт
        uses: actions/checkout@v4

      - name: Пинговать сервис в дневное окно
        run: |
          python3 keepalive.py

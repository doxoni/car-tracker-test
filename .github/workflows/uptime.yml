# Управление монитором UptimeRobot.
#
# Днём (07:00-23:00 по Киеву) монитор пингует сервис - контейнер Render
# не спит, Mini App открывается сразу. Ночью монитор на паузе - контейнер
# засыпает сам и не тратит инстанс-часы бесплатного тарифа (лимит 750
# часов в месяц, а круглосуточная работа - это 744 часа в 31-дневный
# месяц, то есть ровно впритык).
#
# Кто что делает:
#   - контейнер (app/uptime.py) сам ставит монитор на паузу в 23:00 и
#     снимает с паузы, когда просыпается днём;
#   - этот workflow - страховка: включает монитор утром (если ночью
#     сервис так и не просыпался) и выключает его ночью.
#
# Расписание в Actions опаздывает на часы, поэтому решение принимается
# по фактическому киевскому времени, а не по расписанию.
#
# Ключ UptimeRobot лежит в секрете репозитория UPTIME_API_KEY.
name: uptime-monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Забрать скрипт
        uses: actions/checkout@v4

      - name: Обновить состояние монитора
        env:
          UPTIME_API_KEY: ${{ secrets.UPTIME_API_KEY }}
        run: |
          if [ -z "$UPTIME_API_KEY" ]; then
            echo "Ключ UPTIME_API_KEY не задан - пропускаю."
            exit 0
          fi
          python3 uptime_monitor.py auto
